<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120d2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Аура-батлы: путь от Саб3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d2b; --panel:#1d1642; --line:#3a2f78; --text:#f1edff; --mute:#a99fd8;
  --violet:#7b5cff; --gold:#ffd36e; --mint:#5ee6c1; --rose:#ff5d8f;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:Manrope,system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 50% -10%,#3a2a8f 0%,var(--bg) 55%) fixed;
  display:flex;justify-content:center;padding:16px;
}
main{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
h1{font:800 20px/1.1 Unbounded,system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.reset{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.reset:hover{color:var(--text);border-color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font:800 17px Unbounded,system-ui,sans-serif}
.pips{display:flex;gap:6px;margin-top:6px}
.pip{height:6px;flex:1;border-radius:3px;background:var(--line)}
.pip.done{background:var(--mint)}.pip.now{background:var(--gold)}
.arena{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:26px 12px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;
  overflow:hidden;
}
.fighter{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:transform .35s ease}
.orb{--w:92px;position:relative;width:var(--w);height:var(--w);border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#4b3bb0,#2a2160 70%);border:2px solid var(--c);
  box-shadow:0 0 var(--g) var(--c),0 0 calc(var(--g)*2.2) color-mix(in srgb,var(--c) 45%,transparent);transition:box-shadow .6s ease,transform .1s}
.orb svg{width:100%;height:100%;display:block}
.me{--c:var(--gold)}.foe{--c:var(--rose)}
.name{font-weight:700;font-size:14px;min-height:34px;display:flex;align-items:center}
.pw{font:500 12px Unbounded,system-ui,sans-serif;color:var(--mute)}
.vs{font:800 16px Unbounded,system-ui,sans-serif;color:var(--mute)}
.clash .me{transform:translateX(34%)}.clash .foe{transform:translateX(-34%)}
.shake .orb{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chance{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.chance .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--rose),var(--gold),var(--mint));transition:width .5s}
button.go{
  font:800 16px Unbounded,system-ui,sans-serif;color:#1a1333;background:var(--gold);
  border:0;border-radius:14px;padding:16px;cursor:pointer;
}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;max-height:170px;overflow:auto;color:var(--mute)}
.log p+p{margin-top:4px}.log .w{color:var(--mint)}.log .l{color:var(--rose)}.log .u{color:var(--gold)}
[hidden]{display:none!important}
#battleView{display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{font:700 14px Manrope,system-ui,sans-serif;color:var(--mute);background:none;border:0;border-radius:10px;padding:11px;cursor:pointer}
.tab[aria-selected=true]{background:var(--violet);color:#fff}
.home{
  position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(#2a2160 0 68%,#191238 68% 100%);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.home .orb{transition:transform .08s}
.home:active .orb{transform:scale(.94)}
.walk{animation:walk .9s ease-out}
@keyframes walk{from{transform:translateX(-240px)}to{transform:none}}
.pop{position:absolute;font:800 18px Unbounded,system-ui,sans-serif;color:var(--gold);pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{to{transform:translateY(-60px);opacity:0}}
.tabs{grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 2px}
.fighting .me .orb{animation:lungeL 1s infinite}
.fighting .foe .orb{animation:lungeR 1s infinite}
@keyframes lungeL{50%{transform:translateX(18px)}}
@keyframes lungeR{50%{transform:translateX(-18px)}}
.res{min-height:22px;text-align:center;font:700 15px Manrope,system-ui,sans-serif}
.res.w{color:var(--mint)}.res.l{color:var(--rose)}
.home svg{position:absolute;inset:0;width:100%;height:100%}
#scene *{pointer-events:none}
#scene #cab,#scene #cab *,#scene #fridge,#scene #fridge *{pointer-events:auto}
.home .orb{position:relative}
.shop{display:flex;flex-direction:column;gap:6px}
.shop h2{font:800 14px Unbounded,system-ui,sans-serif;margin:8px 0}
.shop .hint{color:var(--mute);font-size:13px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .sw{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:20px;background:#2a2160}
.item .nm{flex:1;font-weight:700;font-size:14px}.item .nm small{display:block;color:var(--mute);font-weight:500}
.item button{font:700 13px Manrope,system-ui,sans-serif;border:0;border-radius:9px;padding:9px 12px;background:var(--gold);color:#1a1333;cursor:pointer}
.item button:disabled{background:var(--line);color:var(--mute);cursor:default}
.soon{color:var(--mute);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.item .sw{overflow:hidden}.item .sw svg{width:100%;height:100%;display:block}
.item.paint{flex-wrap:wrap}.item.paint input{width:46px;height:36px;border:0;background:none;padding:0;cursor:pointer}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.item .cb{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.hm{opacity:0}
.hm.swing{animation:swing var(--d,.3s) ease-in-out}
@keyframes swing{0%,100%{opacity:1;transform:translate(26px,-22px) rotate(30deg)}45%{opacity:1;transform:none}}
.dev-dot{display:block;margin:34px auto 12px;width:14px;height:14px;border-radius:50%;border:0;background:var(--mute);opacity:.07;cursor:pointer;padding:0}
.dev{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px;margin-top:16px}
.dev .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dev b{color:var(--mute);min-width:84px}
.dev input,.dev select{background:#120d2b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;max-width:130px}
.dev button{font:700 12px Manrope,system-ui,sans-serif;background:var(--violet);color:#fff;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.top h1{flex:1}
.top .av{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;padding:0;cursor:pointer;background:#2a2160;border:2px solid var(--fr,#ffd36e);box-shadow:0 0 10px var(--fr,#ffd36e)}
.top .av svg{width:100%;height:100%;display:block}
.modal{position:fixed;inset:0;background:rgba(10,8,25,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead h2{font:800 16px Unbounded,system-ui,sans-serif}
.x{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
#pNick{background:#120d2b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.fr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fr input{width:46px;height:36px;border:0;background:none;padding:0;cursor:pointer}
.fr button{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer}
.pst .p{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pst .p span{color:var(--mute)}.pst .p b{font:800 14px Unbounded,system-ui,sans-serif;text-align:right}
#wardView{display:flex;flex-direction:column;gap:12px}
.wtop{display:flex;align-items:center;gap:10px}.wtop h2{font:800 16px Unbounded,system-ui,sans-serif}
.back{font:700 13px Manrope,system-ui,sans-serif;background:none;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;cursor:pointer}
.wprev{display:flex;justify-content:center;background:linear-gradient(#2a2160 0 72%,#191238 72%);border:1px solid var(--line);border-radius:16px;padding:12px}
.wprev svg{height:290px;width:auto}
#wardView h3{font:800 13px Unbounded,system-ui,sans-serif;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 10px;font:700 13px Manrope,system-ui,sans-serif;cursor:pointer;text-align:left}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.chip .cs{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:15px;flex:none}
.chip i{display:block;font-style:normal;color:var(--mute);font-weight:500;font-size:12px}
.wbtns{display:flex;gap:8px}
.wbtns button{flex:1;font:700 14px Manrope,system-ui,sans-serif;border:0;border-radius:11px;padding:12px;cursor:pointer;background:var(--gold);color:#1a1333}
.wbtns button.alt{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.milkbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.milkbar button,.mk2 button{font:700 13px Manrope,system-ui,sans-serif;border:0;border-radius:9px;padding:9px 12px;background:var(--gold);color:#1a1333;cursor:pointer;flex:none}
.milkbar button:disabled,.mk2 button:disabled{background:var(--line);color:var(--mute);cursor:default}
.mk{display:flex;gap:14px;align-items:center}.mk svg{height:170px;width:auto;flex:none}
.mk p{margin:6px 0;font-size:14px;line-height:1.4}.mk .hint{color:var(--mute);font-size:13px}
.item .lv{display:flex;gap:6px;flex-wrap:wrap}
.item .lb{padding:7px 12px;background:var(--line);color:var(--text)}
.item .lb.on{background:var(--gold);color:#1a1333}
.dev .warn{color:var(--rose);font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:11px 16px;border-radius:12px;font:700 14px Manrope,system-ui,sans-serif;z-index:40;max-width:90%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.dds{display:flex;gap:6px;flex-wrap:wrap}
.dd{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--line);font:700 13px Manrope,system-ui,sans-serif;color:var(--mute)}
.dd.done{background:var(--mint);color:#102}.dd.now{background:var(--gold);color:#1a1333}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>

<linearGradient id="wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58a58"/><stop offset="1" stop-color="#8f5d36"/></linearGradient>
<linearGradient id="wd2" x1="0" x2="1"><stop offset="0" stop-color="#9a683f"/><stop offset=".5" stop-color="#7a5230"/><stop offset="1" stop-color="#5c3d24"/></linearGradient>
<linearGradient id="mt" x1="0" x2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset=".6" stop-color="#d3dbe6"/><stop offset="1" stop-color="#a9b3c2"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>

<main>
  <div class="top">
    <button class="av" id="avBtn" aria-label="Профиль"></button>
    <h1>Аура-батлы</h1>
    <button class="reset" id="reset">Начать заново</button>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabBattle" aria-selected="true">Баттлы</button>
    <button class="tab" role="tab" id="tabHome" aria-selected="false">Дом</button>
    <button class="tab" role="tab" id="tabGym" aria-selected="false">Зал</button>
    <button class="tab" role="tab" id="tabShop" aria-selected="false">Магазин</button>

  <section class="stats" aria-label="Статистика">
    <div class="stat"><small>Ранг</small><b id="rank">Саб3</b></div>
    <div class="stat"><small>MOG</small><b id="aura">0</b></div>
    <div class="stat"><small>Уровень</small><b id="lvl">1 / 120</b></div>

  <div class="pips" id="pips" aria-label="Прогресс уровня"></div>

  <div id="battleView">
  <section class="arena" id="arena">

      <div class="orb" id="meOrb">😞</div>
      <div class="name" id="meName">Ты</div>
      <div class="pw" id="mePw"></div>
    </div>
    <div class="vs">VS</div>
    <div class="fighter foe">
      <div class="orb" id="foeOrb">😐</div>
      <div class="name" id="foeName"></div>
      <div class="pw" id="foePw"></div>

  <section class="chance">

  <div class="milkbar" id="milkBar" hidden></div>

  </div>

  <section class="home" id="homeView" hidden aria-label="Дом: тапай, чтобы копить MOG">
    <svg id="scene" viewBox="0 0 360 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  </section>

  <section class="shop" id="shopView" hidden></section>
  <section id="devBox" hidden></section>
  <section id="wardView" hidden></section>
  <section class="shop" id="gymView" hidden></section>
</main>
<div class="modal" id="dailyModal" hidden><div class="mbox" role="dialog" aria-label="Ежедневная награда"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="milkModal" hidden><div class="mbox" role="dialog" aria-label="Холодильник"></div></div>
<div class="modal" id="profile" hidden>
  <div class="mbox" role="dialog" aria-label="Профиль">

  function battle(){
    if(S.level>MAX_LEVEL){rebirthClick();return}
    if(busy)return;
    var f=foe(S.level,S.idx), win=Math.random()<chance(f), bst=S.boost>0, t=WAIT, my=++token;
    busy=true;
    $('arena').classList.add('fighting');

    $('go').disabled=true;$('go').textContent='Баттл идёт… '+t;
    var iv=setInterval(function(){
      if(my!==token){clearInterval(iv);return}
      t--;
      if(t>0){$('go').textContent='Баттл идёт… '+t;return}
      clearInterval(iv);finish(f,win,bst);
    },1000);
  }
  function finish(f,win,bst){
    busy=false;if(bst&&S.boost>0)S.boost--;
    var arena=$('arena'),res=$('res');
    arena.classList.remove('fighting');arena.classList.add('shake');
    setTimeout(function(){arena.classList.remove('shake')},400);
    if(win){
      S.pending+=f.gain;S.idx++;S.w++;S.streak++;if(S.streak>S.best)S.best=S.streak;
      res.className='res w';res.textContent='Победа!';
      sfx('win');say('Победа над «'+f.name+'».','w');
      if(S.idx>=3){
        var before=rankOf(S.peak)[1],rw=Math.round(S.pending*(1+.08*gl('pos'))*starMul()*10)/10;
        setAura(S.aura+rw);
        say('Уровень '+S.level+' пройден. MOG +'+fmt(rw),'u');
        res.textContent='Уровень пройден! MOG +'+fmt(rw);
        S.pending=0;S.level++;S.idx=0;
        var nr=rankOf(S.peak)[1];if(nr!==before)say('Новый ранг: '+nr,'u');
        if(S.level===GOLD_LEVEL+1)say('Открылась мебель 5 уровня: золотое кресло, стол и люстра в магазине.','u');
        if(S.level>MAX_LEVEL)say('Ты закрыл все 120 уровней. Твой MOG — '+fmt(S.aura)+'. Можно возродиться и получить ★.','u');
      }else say('MOG придёт после прохождения уровня.','');
    }else{
      S.l++;S.streak=0;
      var loss=Math.min(S.aura,Math.round(f.gain*.4));
      setAura(S.aura-loss);
      res.className='res l';res.textContent='Поражение'+(loss?'. MOG −'+fmt(loss):'');
      sfx('lose');say('Поражение от «'+f.name+'». Попробуй ещё раз.','l');
    }
    save();render();
  }

    else if(d==='rankoff')S.dev=null;
    else if(d==='body'){v=$('dBody').value;S.devBody=v===''?null:+v}
    else if(d==='lvl'){v=parseInt($('dLvl').value,10);if(v>=1){S.level=Math.min(v,MAX_LEVEL+1);S.idx=0;S.pending=0}}
    else if(d==='star')S.stars++;
    else if(d==='end'){S.level=MAX_LEVEL+1;S.idx=0;S.pending=0}
    else if(d==='daily'){S.day='';dailyCheck()}
    else if(d==='bone'){S.bone=+$('dBone').value;bone()}
    else if(d==='all'){for(k in ITEMS)if(!owns(k))S.owned.push(k);S.chair=S.table=S.lamp=5;S.chairS=S.tableS=S.lampS=5}
    save();scene();render();
  });


  /* ---------- молочко дяди Богдана ---------- */
  var lastMilk='';
  function bouts(n){var a=n%10,b=n%100;return b>10&&b<15?'боёв':a===1?'бой':a>1&&a<5?'боя':'боёв'}
  function boostText(){return S.boost>0?'+'+Math.round(MILK_BONUS*100)+'% к шансу ещё на '+S.boost+' '+bouts(S.boost):'эффекта нет'}
  function renderMilk(){
    var b=$('milkBar'),on=S.fridge||S.boost>0,h='';
    if(on)h='<span>🥛 '+boostText()+' · в запасе: '+S.milk+'</span><button data-m="drink"'+(S.milk?'':' disabled')+'>Выпить</button>';
    if(h!==lastMilk){lastMilk=h;b.innerHTML=h;b.hidden=!on}
  }
  function buyMilk(){
    if(S.aura<MILK_PRICE)return;
    setAura(S.aura-MILK_PRICE);S.milk++;
    if(!S.fridge){S.fridge=true;say('В доме появился холодильник: загляни в него.','u')}
    save();scene();render();if(!$('milkModal').hidden)renderMilkModal();
  }
  function drinkMilk(){
    if(S.milk<1)return;
    S.milk--;S.drunk++;sfx('buy');S.boost=Math.min(BOOST_CAP,S.boost+MILK_BATTLES);
    say('Выпил молочко дяди Богдана. Шанс победы +'+Math.round(MILK_BONUS*100)+'% на '+MILK_BATTLES+' '+bouts(MILK_BATTLES)+'.','u');
    save();render();if(!$('milkModal').hidden)renderMilkModal();
  }
  function renderMilkModal(){
    $('milkModal').firstElementChild.innerHTML='<div class="mhead"><h2>Холодильник</h2><button class="x" data-m="close" aria-label="Закрыть">✕</button></div>'+
      '<div class="mk">'+milkSvg()+'<div><b>Молочко дяди Богдана</b><p class="hint">Выпей, и шанс победы вырастет на '+Math.round(MILK_BONUS*100)+'% на '+MILK_BATTLES+' '+bouts(MILK_BATTLES)+'.</p><p>В запасе: <b>'+S.milk+'</b></p><p>Сейчас: '+boostText()+'</p></div></div>'+
      '<div class="wbtns mk2"><button data-m="drink"'+(S.milk?'':' disabled')+'>Выпить</button><button data-m="buy"'+(S.aura<MILK_PRICE?' disabled':'')+'>Купить · '+fmt(MILK_PRICE)+' MOG</button></div>';
  }
  $('milkBar').addEventListener('click',function(e){if(e.target.closest('[data-m=drink]'))drinkMilk()});
  $('milkModal').addEventListener('click',function(e){
    if(e.target===this){this.hidden=true;return}
    var b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;
    var m=b.getAttribute('data-m');
    if(m==='close')this.hidden=true;else if(m==='drink')drinkMilk();else if(m==='buy')buyMilk();
  });

  /* ---------- профиль ---------- */
  var FRAMES=['#ffd36e','#5ee6c1','#ff5d8f','#7b5cff','#6ec6ff','#ffffff'];
  function applyProfile(){
    var fr=S.frame||'#ffd36e';
    $('avBtn').style.setProperty('--fr',fr);$('meOrb').style.setProperty('--c',fr);
    $('meName').textContent=S.nick||'Ты';
  }
  function renderProfile(){
    var t=S.w+S.l,m=RANKS[effRank()][4];
    function p(a,b){return '<div class="p"><span>'+a+'</span><b>'+b+'</b></div>'}
    $('pStats').innerHTML=p('Ранг',RANKS[effRank()][1])+p('Коэффициент победы','×'+m)+p('Лучшая серия побед',S.best)+p('Текущая серия',S.streak)+
      p('Победы / поражения',S.w+' / '+S.l+(t?' ('+Math.round(100*S.w/t)+'%)':''))+p('MOG',fmt(S.aura))+p('Звёзды возрождения','★ '+S.stars)+p('Достижения',Object.keys(S.ach).length+' / '+ACH.length);
    $('pSnd').textContent=S.snd?'Звук: включён':'Звук: выключен';
  }
  (function(){
    var h='';FRAMES.forEach(function(c){h+='<button data-c="'+c+'" style="background:'+c+'" aria-label="Цвет '+c+'"></button>'});
    $('pSw').innerHTML=h;
  })();
  $('avBtn').addEventListener('click',function(){$('pNick').value=S.nick||'';$('pFrame').value=S.frame;renderProfile();$('profile').hidden=false});
  $('pClose').addEventListener('click',function(){$('profile').hidden=true});
  $('profile').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
  $('pNick').addEventListener('input',function(){S.nick=this.value.slice(0,16);save();applyProfile()});
  $('pFrame').addEventListener('input',function(){S.frame=this.value;lastKey=null;save();applyProfile();scene()});
  $('pSw').addEventListener('click',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-c');if(!c)return;S.frame=c;$('pFrame').value=c;lastKey=null;save();applyProfile();scene()});

  /* ---------- крупное обновление: зал, достижения, награды, звук, возрождение ---------- */
  var GYM={
    jaw:{n:'Челюсть',e:'🦴',base:150,d:'+5% к силе в баттлах за уровень'},
    skin:{n:'Кожа',e:'✨',base:100,d:'+10% MOG за тап и удар молотка за уровень'},
    pos:{n:'Осанка',e:'🧍',base:200,d:'+8% MOG за прохождение уровня за уровень'},
    cha:{n:'Харизма',e:'😎',base:300,d:'+1% к шансу победы за уровень'},
    rit:{n:'Режим дня',e:'😴',base:250,d:'пассивный доход MOG, идёт и пока тебя нет (до 4 часов)'}};
  function gl(k){return S.gym&&S.gym[k]||0}
  function starMul(){return 1+.1*(S.stars||0)}
  function gcost(k){return Math.round(GYM[k].base*Math.pow(1.65,gl(k)))}
  function passiveRate(){var r=gl('rit');return r*r*.5*starMul()}
  function passive(show){
    var now=Date.now(),dt=Math.min((now-(S.last||now))/60000,240);S.last=now;
    var g=Math.round(passiveRate()*dt*100)/100;
    if(g>0){setAura(S.aura+g);if(show&&dt>=1)say('Пока тебя не было, ты заработал '+fmt(g)+' MOG.','u')}
    return g;
  }
  setInterval(function(){if(passive(false)>0){save();render()}},5000);

  /* тосты и звук */
  var tq=[],tb=false;
  function toast(t){tq.push(t);if(!tb)nextToast()}
  function nextToast(){
    var t=tq.shift(),e=$('toast');
    if(!t){tb=false;e.hidden=true;return}
    tb=true;e.textContent=t;e.hidden=false;setTimeout(nextToast,2600);
  }
  var AC=null;
  function beep(f,d,t,v){
    if(!S||!S.snd)return;
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended')AC.resume();
      var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
      o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d);
    }catch(e){}
  }
  function sfx(n){
    var seq={tap:[[660,.05,'triangle',.03]],buy:[[880,.07,'sine',.05],[1175,.1,'sine',.05]],lose:[[220,.25,'sawtooth',.04]],
             win:[[523,.1,'triangle',.06],[659,.1,'triangle',.06],[784,.18,'triangle',.06]],
             ach:[[523,.1,'sine',.06],[659,.1,'sine',.06],[784,.1,'sine',.06],[1046,.22,'sine',.06]]}[n]||[];
    seq.forEach(function(x,i){setTimeout(function(){beep(x[0],x[1],x[2],x[3])},i*100)});
  }

  /* достижения */
  var ACH=[
    ['win1','Первая кровь','выиграй первый бой',function(){return S.w>=1},20],
    ['win25','Разогрев','25 побед',function(){return S.w>=25},80],
    ['win100','Ветеран','100 побед',function(){return S.w>=100},300],
    ['st5','Горячая серия','5 побед подряд',function(){return S.best>=5},60],
    ['st10','Неостановимый','10 побед подряд',function(){return S.best>=10},200],
    ['l10','Школа жизни','пройди 10 уровней',function(){return S.level>10},100],
    ['l50','На полпути','пройди 50 уровней',function(){return S.level>50},600],
    ['l120','Легенда','пройди все 120 уровней',function(){return S.level>MAX_LEVEL||S.stars>0},2000],
    ['rk2','Нормис','достигни ранга ЛТН',function(){return baseRank()>=2},50],
    ['rk5','Чад','достигни ранга Чад',function(){return baseRank()>=5},400],
    ['rk6','Тру Адам','достигни ранга Тру Адам',function(){return baseRank()>=6},1500],
    ['milk','Кальций','выпей 10 молочек дяди Богдана',function(){return S.drunk>=10},150],
    ['cozy','Уютный дом','купи весь декор',function(){for(var k in DECOR)if(!owns(k))return false;return true},200],
    ['gym5','Качалка','прокачай любой стат Зала до 5 уровня',function(){for(var k in GYM)if(gl(k)>=5)return true;return false},150],
    ['bone','Костоломка','Bonesmashing на 4 уровне',function(){return S.bone>=4},500],
    ['rb','Перерождение','возродись в первый раз',function(){return S.stars>=1},1000]];
  function checkAch(){
    ACH.forEach(function(a){
      if(!S.ach[a[0]]&&a[3]()){S.ach[a[0]]=1;setAura(S.aura+a[4]);toast('🏆 '+a[1]+' · +'+a[4]+' MOG');sfx('ach');save()}
    });
  }

  /* зал */
  var lastGym='';
  function renderGym(){
    var h='<p class="hint">Прокачивай внешность за MOG, бонусы работают всегда. Пассивный доход: '+fmt(passiveRate())+' MOG в минуту'+(S.stars?' · возрождения ★'+S.stars+': +'+S.stars*10+'% к силе и наградам':'')+'.</p><h2>Внешность</h2>',k,done=0;
    for(k in GYM){var G=GYM[k],l=gl(k);
      h+=row(G.e,G.n+' · ур. '+l+'/10',G.d,l>=10?'<button disabled>Максимум</button>':buyBtn('g:'+k,gcost(k)))}
    ACH.forEach(function(a){if(S.ach[a[0]])done++});
    h+='<h2>Достижения · '+done+'/'+ACH.length+'</h2>';
    ACH.forEach(function(a){h+=row(S.ach[a[0]]?'✅':'🔒',a[1],a[2]+' · награда '+fmt(a[4])+' MOG',S.ach[a[0]]?'<button disabled>Получено</button>':'')});
    h+='<h2>Возрождение</h2>'+row('★','Звёзды: '+S.stars,'после 120 уровня можно возродиться: дом, одежда и покупки останутся, MOG и прокачка Зала сбросятся. Каждая ★ даёт +10% к силе и наградам','');
    if(h!==lastGym){lastGym=h;$('gymView').innerHTML=h}
  }
  $('gymView').addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;
    var id=b.getAttribute('data-id');if(!id||id.indexOf('g:')!==0)return;
    var k=id.slice(2),c=gcost(k);if(!GYM[k]||gl(k)>=10||S.aura<c)return;
    setAura(S.aura-c);S.gym[k]=gl(k)+1;sfx('buy');save();scene();render();
  });

  /* возрождение */
  var rebArmed=0;
  function rebirthClick(){
    if(!rebArmed||Date.now()-rebArmed>5000){
      rebArmed=Date.now();render();
      setTimeout(function(){if(rebArmed&&Date.now()-rebArmed>=5000){rebArmed=0;render()}},5100);return;
    }
    rebArmed=0;rebirth();
  }
  function rebirth(){
    var keep=['owned','wall','paint','hair','top','bottom','shoes','art','chair','table','lamp','chairS','tableS','lampS','fridge','milk','bone','nick','frame','w','l','best','ach','drunk','snd','day','dn','dev','devBody'],old=S,n=fresh();
    keep.forEach(function(k){if(old[k]!==undefined)n[k]=old[k]});
    n.stars=(old.stars||0)+1;S=n;
    token++;busy=false;lastKey=null;lastShop='';lastGym='';
    $('log').textContent='';$('res').textContent='';$('res').className='res';
    say('Возрождение! Теперь у тебя ★'+S.stars+': +'+S.stars*10+'% к силе и наградам. Дом и одежда остались.','u');
    sfx('ach');save();scene();render();show('battle');
  }

  /* ежедневная награда */
  var DAILY=[30,50,80,120,180,260,500],dl=null;
  function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
  function dailyCheck(){
    var today=dstr(new Date());if(S.day===today)return;
    var y=dstr(new Date(Date.now()-864e5)),next=S.day===y?(S.dn%7)+1:1,rew=Math.round(DAILY[next-1]*(1+S.level*.08)),h='',i;
    dl={today:today,next:next,rew:rew};
    for(i=1;i<=7;i++)h+='<span class="dd'+(i<next?' done':i===next?' now':'')+'">'+i+'</span>';
    $('dailyModal').firstElementChild.innerHTML='<div class="mhead"><h2>Ежедневная награда</h2></div><div class="dds">'+h+'</div>'+
      '<p style="font-size:15px">День '+next+' из 7: <b>+'+fmt(rew)+' MOG</b></p><p class="hint" style="font-size:13px;color:var(--mute)">Заходи каждый день, награда растёт. Пропустишь день, серия начнётся заново.</p>'+
      '<div class="wbtns"><button data-dl="claim">Забрать</button></div>';
    $('dailyModal').hidden=false;
  }
  $('dailyModal').addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||!dl||b.getAttribute('data-dl')!=='claim')return;
    setAura(S.aura+dl.rew);S.day=dl.today;S.dn=dl.next;toast('🎁 Ежедневная награда: +'+fmt(dl.rew)+' MOG');sfx('ach');
    dl=null;this.hidden=true;save();render();
  });
  $('pSnd').addEventListener('click',function(){S.snd=!S.snd;if(S.snd)sfx('buy');save();renderProfile()});

  /* ---------- вкладки и тапы ---------- */
  function show(tab){
    $('devBox').hidden=tab!=='shop';$('gymView').hidden=tab!=='gym';
    $('wardView').hidden=tab!=='ward';
    $('battleView').hidden=tab!=='battle';$('homeView').hidden=tab!=='home';$('shopView').hidden=tab!=='shop';
    $('tabBattle').setAttribute('aria-selected',tab==='battle');
    $('tabHome').setAttribute('aria-selected',tab==='home'||tab==='ward');
    $('tabShop').setAttribute('aria-selected',tab==='shop');$('tabGym').setAttribute('aria-selected',tab==='gym');
    if(tab==='home'){scene();var o=$('scene').querySelector('.hero');if(o){o.classList.remove('walk');void o.getBoundingClientRect();o.classList.add('walk')}}
    if(tab==='shop')renderShop();
    if(tab==='gym')renderGym();
    if(tab==='ward')renderWard();
  }
  $('tabBattle').addEventListener('click',function(){show('battle')});
  $('tabGym').addEventListener('click',function(){show('gym')});
  $('tabHome').addEventListener('click',function(){show('home')});
  $('tabShop').addEventListener('click',function(){show('shop')});
  $('go').addEventListener('click',battle);

  $('homeView').addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('#cab')){openWard();return}
    if(e.target.closest&&e.target.closest('#fridge')){renderMilkModal();$('milkModal').hidden=false;return}
    var g=tapGain();setAura(S.aura+g);sfx('tap');save();render();
    var r=this.getBoundingClientRect();
    pop((e.clientX-r.left-10)+'px',(e.clientY-r.top-20)+'px','+'+fmt(g));
  });

  $('reset').addEventListener('click',function(){
    if(confirm('Сбросить весь прогресс и снова стать Саб3?')){
      token++;busy=false;$('arena').classList.remove('fighting');
      var nk=S.nick,fr=S.frame;S=fresh();S.nick=nk;S.frame=fr;lastKey=null;bone();save();$('log').textContent='';$('res').textContent='';
      say('Ты снова Саб3. Всё впереди.');scene();render();
    }
  });

  S=load();
  say(S.aura?'С возвращением. Прогресс загружен.':'Ты начинаешь как Саб3. Нажми «Начать»: результат баттла будет через 5 секунд. Побеждай, копи MOG и обустраивай дом.');
  passive(true);
  renderDev();bone();scene();render();
  dailyCheck();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
